<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字跑酷 · 数字接龙大冒险</title>
<style>
:root {
  --薄香: #F6E8CE;
  --薄香深: #EDD9B0;
  --薄香浅: #FBF3E3;
  --松果褐: #5C4433;
  --松果褐深: #3E2E23;
  --松果褐浅: #8A6A4F;
  --金: #E0A94E;
  --红心: #E8543F;
  --绿: #4FA36A;
  --白: #FFFDF7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: radial-gradient(1200px 700px at 50% -10%, var(--薄香浅), var(--薄香) 55%, var(--薄香深));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
/* 背景漂浮颗粒 */
#bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.particle {
  position: absolute;
  border-radius: 50%;
  background: var(--金);
  opacity: .25;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  10% { opacity: .3; }
  100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
}

/* ============ 游戏舞台 ============ */
#stage {
  position: relative;
  width: min(94vw, 560px);
  height: min(92vh, 820px);
  min-height: 620px;
  background: linear-gradient(180deg, #FDF6E7 0%, #F6E8CE 60%, #EAD5AC 100%);
  border-radius: 28px;
  box-shadow: 0 24px 60px rgba(92,68,51,.35), inset 0 0 0 6px rgba(255,255,255,.4);
  overflow: hidden;
  z-index: 1;
}

/* 顶部信息栏 */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 10;
}
#expression {
  font-size: 30px;
  font-weight: 900;
  color: var(--松果褐深);
  letter-spacing: 2px;
  background: rgba(255,253,247,.75);
  padding: 8px 20px;
  border-radius: 16px;
  box-shadow: 0 4px 0 rgba(92,68,51,.15);
  transition: transform .2s;
}
#expression.flash { animation: pop .5s ease; }
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.25) rotate(-3deg); }
  100% { transform: scale(1); }
}
#hearts {
  display: flex;
  gap: 6px;
}
#hud-right { display: flex; align-items: center; gap: 10px; }
#pause-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  border: 2px solid var(--松果褐);
  background: rgba(255,253,247,.75);
  color: var(--松果褐);
  border-radius: 12px;
  cursor: pointer;
  transition: all .15s;
  box-shadow: 0 3px 0 rgba(92,68,51,.2);
}
#pause-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(92,68,51,.2); }
#pause-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(92,68,51,.2); }
#pause-btn.hidden { visibility: hidden; }
.heart {
  font-size: 30px;
  color: var(--红心);
  filter: drop-shadow(0 3px 4px rgba(232,84,63,.4));
  transition: all .3s;
  animation: beat 1.4s ease-in-out infinite;
}
.heart:nth-child(2) { animation-delay: .2s; }
.heart:nth-child(3) { animation-delay: .4s; }
.heart.lost {
  color: rgba(92,68,51,.22);
  filter: none;
  animation: none;
  transform: scale(.8);
}
.heart.burst { animation: heartBurst .6s ease forwards !important; }
@keyframes beat {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.18); }
  50% { transform: scale(1); }
}
@keyframes heartBurst {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.9); opacity: .4; }
  100% { transform: scale(.7); opacity: 0; }
}

/* 得分 */
#score-display {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 15px;
  font-weight: 700;
  color: var(--松果褐浅);
  letter-spacing: 1px;
  z-index: 9;
  pointer-events: none;
}

/* 掉落区域 */
#drop-area {
  position: absolute;
  top: 70px; bottom: 0; left: 0; right: 0;
}

/* 数字块 */
.num {
  position: absolute;
  top: -80px;
  width: 66px; height: 66px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color: var(--白);
  background: linear-gradient(145deg, var(--松果褐浅), var(--松果褐));
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--松果褐深), 0 10px 18px rgba(62,46,35,.35);
  animation: wobble 1.6s ease-in-out infinite;
  transition: box-shadow .15s;
  z-index: 5;
  cursor: default;
}
.num.small { font-size: 20px; width: 56px; height: 56px; border-radius: 15px; }
.num.correct {
  background: linear-gradient(145deg, #7CC79B, var(--绿));
  box-shadow: 0 6px 0 #2E6B45, 0 10px 18px rgba(47,107,69,.4);
  animation: correctPulse .8s ease-in-out infinite;
}
.num.grab {
  transform: scale(1.2);
  box-shadow: 0 0 0 8px rgba(224,169,78,.5), 0 6px 0 var(--松果褐深);
  animation: none;
}
@keyframes wobble {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
}
@keyframes correctPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

/* 小人 */
#player {
  position: absolute;
  bottom: 14px;
  width: 92px;
  height: 118px;
  z-index: 8;
  transition: left .12s linear;
  filter: drop-shadow(0 8px 10px rgba(92,68,51,.3));
}
#player .head {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 50px; height: 50px;
  background: #F6C78E;
  border-radius: 50%;
  border: 3px solid var(--松果褐);
  z-index: 2;
}
/* 刘海/发丝 */
#player .hair {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 46px; height: 20px;
  background: #4A3426;
  border-radius: 50% 50% 40% 40%;
  z-index: 3;
}
#player .hair::before, #player .hair::after {
  content: ""; position: absolute; top: 6px; width: 10px; height: 14px;
  background: #4A3426; border-radius: 50%;
}
#player .hair::before { left: -6px; }
#player .hair::after { right: -6px; }
#player .face { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 36px; z-index: 3; }
#player .eye {
  position: absolute; top: 0; width: 9px; height: 11px; background: var(--松果褐深); border-radius: 50%;
  animation: blink 3.2s infinite;
}
#player .eye::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 4px; height: 4px;
  background: #fff; border-radius: 50%;
}
#player .eye.l { left: 3px; }
#player .eye.r { right: 3px; }
#player .mouth {
  position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 7px; border-bottom: 3px solid var(--松果褐深); border-radius: 0 0 12px 12px;
}
#player .blush {
  position: absolute; top: 11px; width: 8px; height: 5px;
  background: #F5A08C; border-radius: 50%; opacity: .8;
}
#player .blush.l { left: -2px; }
#player .blush.r { right: -2px; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1);} 95% { transform: scaleY(.1);} }
#player .body {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
  width: 40px; height: 46px; background: #D96F3C; border-radius: 12px 12px 16px 16px; border: 3px solid var(--松果褐);
}
#player .body::before {
  content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 14px; background: #F6C78E; border-radius: 50%;
  border: 2px solid var(--松果褐);
}
#player .arm {
  position: absolute; top: 46px; width: 20px; height: 10px; background: #D96F3C; border: 3px solid var(--松果褐); border-radius: 8px;
  transform-origin: 50% 10%;
}
#player .arm.l { left: 2px; transform: rotate(-40deg); }
#player .arm.r { right: 2px; transform: rotate(40deg); }
/* 脸盆 —— 放在头顶 */
#player .basin {
  position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
  width: 86px; height: 26px;
  background: linear-gradient(180deg, #E9C88B, #D4A857);
  border: 3px solid var(--松果褐);
  border-radius: 14px 14px 16px 16px;
  box-shadow: 0 3px 0 rgba(92,68,51,.2);
  z-index: 1;
}
#player .basin::after {
  content: ""; position: absolute; top: 9px; left: 8px; right: 8px; height: 5px;
  background: rgba(92,68,51,.22); border-radius: 50%;
}
/* 盆里接到的数字 */
#basin-num {
  position: absolute; top: -44px; left: 50%; transform: translateX(-50%);
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; color: var(--白);
  background: var(--金); border-radius: 10px;
  box-shadow: 0 3px 0 var(--松果褐);
  z-index: 9;
  transition: all .2s;
}
#basin-num.empty { background: transparent; box-shadow: none; }
#player.run .arm.l { animation: armL .5s ease-in-out infinite; }
#player.run .arm.r { animation: armR .5s ease-in-out infinite; }
#player.run .body { animation: bob .5s ease-in-out infinite; }
#player.run .basin { animation: basinWobble .5s ease-in-out infinite; }
@keyframes armL { 0%,100% { transform: rotate(-40deg);} 50% { transform: rotate(-70deg);} }
@keyframes armR { 0%,100% { transform: rotate(40deg);} 50% { transform: rotate(70deg);} }
@keyframes bob { 0%,100% { transform: translateX(-50%) translateY(0);} 50% { transform: translateX(-50%) translateY(-4px);} }
@keyframes basinWobble { 0%,100% { transform: translateX(-50%) rotate(0);} 50% { transform: translateX(-50%) rotate(3deg);} }
#player.happy { animation: happyJump .5s ease; }
@keyframes happyJump {
  0%,100% { transform: translateY(0); }
  40% { transform: translateY(-22px) rotate(-6deg); }
  70% { transform: translateY(0) rotate(3deg); }
}
#player.sad { animation: sadShake .5s ease; }
@keyframes sadShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* 飘字特效 */
.float-text {
  position: absolute;
  font-size: 30px; font-weight: 900;
  z-index: 20; pointer-events: none;
  animation: floatText 1s ease forwards;
}
@keyframes floatText {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  20% { transform: scale(1.2); opacity: 1; }
  100% { transform: translateY(-90px) scale(1); opacity: 0; }
}

/* 粒子爆发 */
.spark {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  z-index: 19; pointer-events: none;
  animation: spark .7s ease-out forwards;
}
@keyframes spark {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}

/* 提示文字 */
#message {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 22px; font-weight: 800;
  color: var(--松果褐深);
  text-align: center;
  line-height: 1.6;
  z-index: 15;
  pointer-events: none;
  text-shadow: 0 2px 0 rgba(255,255,255,.6);
}
#message .sub { font-size: 15px; color: var(--松果褐浅); font-weight: 600; }

/* 阶段提示条 */
#phase-tip {
  position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
  padding: 6px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 700; color: var(--白);
  background: var(--松果褐);
  opacity: 0; transition: opacity .4s;
  z-index: 10; pointer-events: none;
}
#phase-tip.show { opacity: 1; }

/* ============ 遮罩 & 弹窗 ============ */
.overlay {
  position: absolute; inset: 0;
  background: rgba(62,46,35,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 30;
  backdrop-filter: blur(3px);
}
.overlay.hidden { display: none; }
.panel {
  background: linear-gradient(160deg, #FDF7EA, var(--薄香));
  border-radius: 24px;
  padding: 28px 30px;
  width: 86%;
  box-shadow: 0 18px 40px rgba(62,46,35,.4), inset 0 0 0 4px rgba(255,255,255,.5);
  text-align: center;
  animation: panelIn .4s cubic-bezier(.2,1.4,.4,1);
}
@keyframes panelIn {
  from { transform: scale(.7) translateY(20px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
.panel h1 {
  font-size: 30px; color: var(--松果褐深); letter-spacing: 2px;
  margin-bottom: 4px;
}
.panel .logo-emoji { font-size: 46px; display: block; animation: beat 1.4s infinite; }
.panel .tagline { font-size: 13px; color: var(--松果褐浅); margin-bottom: 18px; }

.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 0;
  font-size: 15px; font-weight: 700; color: var(--松果褐深);
}
.setting-row label { text-align: left; }
.seg { display: flex; gap: 6px; }
.seg button {
  border: 2px solid var(--松果褐);
  background: var(--白); color: var(--松果褐);
  padding: 7px 12px; border-radius: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all .18s;
}
.seg button.active {
  background: var(--松果褐); color: var(--白);
  box-shadow: 0 3px 0 var(--松果褐深);
  transform: translateY(-1px);
}
.seg button:hover { transform: translateY(-2px); }

.range-label { font-size: 13px; color: var(--松果褐浅); font-weight: 600; margin-left: 8px; }

.btn-primary {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  font-size: 19px; font-weight: 900; letter-spacing: 2px;
  color: var(--白);
  background: linear-gradient(145deg, var(--松果褐浅), var(--松果褐));
  border: none; border-radius: 16px;
  box-shadow: 0 6px 0 var(--松果褐深);
  cursor: pointer;
  transition: all .15s;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--松果褐深); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--松果褐深); }

.btn-secondary {
  margin-top: 12px;
  width: 100%;
  padding: 12px;
  font-size: 16px; font-weight: 700;
  color: var(--松果褐);
  background: var(--白);
  border: 2px solid var(--松果褐);
  border-radius: 14px;
  cursor: pointer;
  transition: all .15s;
}
.btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 4px 0 rgba(92,68,51,.2); }
.btn-secondary:active { transform: translateY(1px); }

.final-score { font-size: 64px; font-weight: 900; color: var(--金); margin: 8px 0; }
.stat { font-size: 15px; color: var(--松果褐浅); font-weight: 600; margin: 4px 0; }

@media (max-width: 420px) {
  #stage { height: 96vh; border-radius: 18px; }
  .num { width: 54px; height: 54px; font-size: 22px; }
}
</style>
</head>
<body>
<div id="bg-particles"></div>

<div id="stage">
  <!-- 顶部 HUD -->
  <div id="hud">
    <div id="expression">准备…</div>
    <div id="hud-right">
      <button id="pause-btn" title="暂停">⏸</button>
      <div id="hearts">
        <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
      </div>
    </div>
  </div>
  <div id="score-display">得分 0 · 第 1 关</div>
  <div id="phase-tip"></div>

  <div id="drop-area"></div>

  <!-- 小人 -->
  <div id="player">
    <div class="basin"></div>
    <div id="basin-num" class="empty"></div>
    <div class="head">
      <div class="hair"></div>
      <div class="face">
        <div class="eye l"></div><div class="eye r"></div>
        <div class="mouth"></div>
        <div class="blush l"></div><div class="blush r"></div>
      </div>
    </div>
    <div class="body"></div>
    <div class="arm l"></div>
    <div class="arm r"></div>
  </div>

  <div id="message"></div>

  <!-- 开始/设置弹窗 -->
  <div class="overlay" id="menu-overlay">
    <div class="panel">
      <span class="logo-emoji">🥣</span>
      <h1>数字跑酷</h1>
      <div class="tagline">接数字 · 算答案 · 顶着脸盆去冒险！</div>

      <div class="setting-row">
        <label>数字范围</label>
        <div class="seg" id="range-seg">
          <button data-v="10">0-10</button>
          <button data-v="20">0-20</button>
          <button data-v="100" class="active">0-100</button>
        </div>
      </div>

      <div class="setting-row">
        <label>接取次数</label>
        <div class="seg" id="pick-seg">
          <button data-v="2">2 次</button>
          <button data-v="3" class="active">3 次</button>
        </div>
      </div>

      <div class="setting-row">
        <label>运算方式</label>
        <div class="seg" id="op-seg">
          <button data-v="add" class="active">＋</button>
          <button data-v="sub" class="active">－</button>
          <button data-v="mul" class="active">×</button>
          <button data-v="div" class="active">÷</button>
        </div>
      </div>

      <div class="setting-row">
        <label>下落速度</label>
        <div class="seg" id="speed-seg">
          <button data-v="slow">慢</button>
          <button data-v="mid">中</button>
          <button data-v="fast" class="active">快</button>
        </div>
      </div>

      <div class="setting-row">
        <label>音效</label>
        <div class="seg" id="sound-seg">
          <button data-v="on" class="active">开 🔊</button>
          <button data-v="off">关 🔇</button>
        </div>
      </div>

      <button class="btn-primary" id="start-btn">开始游戏 🚀</button>
    </div>
  </div>

  <!-- 暂停弹窗 -->
  <div class="overlay hidden" id="pause-overlay">
    <div class="panel">
      <span class="logo-emoji">⏸️</span>
      <h1>已暂停</h1>
      <div class="tagline">休息一下，随时继续</div>
      <button class="btn-primary" id="resume-btn">继续游戏 ▶️</button>
      <button class="btn-secondary" id="pause-restart-btn">重新开始 🔄</button>
      <button class="btn-secondary" id="pause-exit-btn">退出到菜单 🏠</button>
    </div>
  </div>

  <!-- 结束弹窗 -->
  <div class="overlay hidden" id="over-overlay">
    <div class="panel">
      <span class="logo-emoji">🏆</span>
      <h1 id="over-title">闯关成功！</h1>
      <div class="final-score" id="final-score">0</div>
      <div class="stat" id="final-round">通过 0 关</div>
      <button class="btn-primary" id="restart-btn">再来一局 🔄</button>
      <button class="btn-secondary" id="over-exit-btn">退出到菜单 🏠</button>
    </div>
  </div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const dropArea = document.getElementById('drop-area');
  const player = document.getElementById('player');
  const basinNum = document.getElementById('basin-num');
  const expressionEl = document.getElementById('expression');
  const hearts = document.querySelectorAll('.heart');
  const scoreDisplay = document.getElementById('score-display');
  const phaseTip = document.getElementById('phase-tip');
  const messageEl = document.getElementById('message');
  const menuOverlay = document.getElementById('menu-overlay');
  const overOverlay = document.getElementById('over-overlay');
  const pauseOverlay = document.getElementById('pause-overlay');
  const pauseBtn = document.getElementById('pause-btn');

  // ===== 设置 =====
  const settings = { range: 100, picks: 3, ops: ['add','sub','mul','div'], speed: 'fast' };
  const speedMap = { slow: 1.3, mid: 2.3, fast: 3.8 }; // 像素/帧基准
  const opMap = { add: ['+', (a,b)=>a+b], sub: ['-', (a,b)=>a-b], mul: ['×', (a,b)=>a*b], div: ['÷', (a,b)=>b!==0?Math.round(a/b*100)/100:0] };

  // ===== 游戏状态 =====
  let state = {
    lives: 3, score: 0, round: 1,
    picked: [],          // 已接到的数字
    mode: 'collect',     // collect: 接数字 | answer: 接答案
    collecting: false,
    collectedCount: 0,
    target: null,        // 正确答案
    nums: [],            // 当前屏幕上的数字块
    raf: null,
    running: false,
    paused: false
  };

  // ===== 音效系统（Web Audio API，无需外部文件） =====
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type='sine', vol=0.18, slideTo=null){
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime + start;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  // 接数字：清脆的"叮"（上行双音）
  function sfxCatch(){
    tone(660, 0, 0.12, 'sine', 0.2);
    tone(990, 0.08, 0.18, 'sine', 0.18);
  }
  // 答对：欢快的上行琶音
  function sfxCorrect(){
    tone(523.25, 0, 0.12, 'triangle', 0.2);
    tone(659.25, 0.09, 0.12, 'triangle', 0.2);
    tone(783.99, 0.18, 0.16, 'triangle', 0.2);
    tone(1046.5, 0.27, 0.28, 'triangle', 0.22);
  }
  // 答错：低沉下滑音
  function sfxWrong(){
    tone(320, 0, 0.28, 'sawtooth', 0.14, 140);
    tone(160, 0.05, 0.3, 'square', 0.08, 90);
  }
  // 游戏结束：缓慢下行
  function sfxGameOver(){
    tone(440, 0, 0.2, 'triangle', 0.18);
    tone(349, 0.18, 0.2, 'triangle', 0.18);
    tone(261, 0.36, 0.4, 'triangle', 0.2);
  }
  // 暂停：短促
  function sfxPause(){
    tone(500, 0, 0.08, 'sine', 0.12);
    tone(400, 0.08, 0.08, 'sine', 0.12);
  }
  // 点击按钮
  function sfxClick(){
    tone(700, 0, 0.06, 'sine', 0.1);
  }

  // ===== 背景粒子 =====
  function initBg() {
    const bg = document.getElementById('bg-particles');
    for (let i=0;i<22;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const s = 6 + Math.random()*18;
      p.style.width = s+'px'; p.style.height = s+'px';
      p.style.left = Math.random()*100+'vw';
      p.style.bottom = -40+'px';
      p.style.animationDuration = (10+Math.random()*16)+'s';
      p.style.animationDelay = Math.random()*10+'s';
      bg.appendChild(p);
    }
  }
  initBg();

  // ===== 设置区交互 =====
  function bindSeg(segId, key, mapper){
    const seg = document.getElementById(segId);
    seg.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        settings[key] = mapper ? mapper(b.dataset.v) : b.dataset.v;
        if (key==='picks' || key==='range') settings[key] = parseInt(settings[key]);
      });
    });
  }
  bindSeg('range-seg', 'range');
  bindSeg('pick-seg', 'picks');
  bindSeg('speed-seg', 'speed');

  // 运算方式：多选
  const opSeg = document.getElementById('op-seg');
  opSeg.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = b.dataset.v;
      const i = settings.ops.indexOf(v);
      if (i >= 0){
        // 至少保留一个
        if (settings.ops.length === 1){ showMessage('至少选择一种运算方式'); return; }
        settings.ops.splice(i,1);
        b.classList.remove('active');
      } else {
        settings.ops.push(v);
        b.classList.add('active');
      }
      sfxClick();
    });
  });

  // 音效开关
  const soundSeg = document.getElementById('sound-seg');
  soundSeg.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      soundSeg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      soundOn = (b.dataset.v === 'on');
      if (soundOn) sfxClick();
    });
  });

  // ===== 工具 =====
  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function stageW(){ return stage.clientWidth; }
  function stageH(){ return stage.clientHeight; }

  // 可取消的定时器，暂停时清空
  const pendingTimers = [];
  function schedule(fn, delay){
    const id = setTimeout(()=>{
      const idx = pendingTimers.indexOf(id);
      if (idx >= 0) pendingTimers.splice(idx,1);
      fn();
    }, delay);
    pendingTimers.push(id);
    return id;
  }
  function clearPending(){
    pendingTimers.forEach(id=>clearTimeout(id));
    pendingTimers.length = 0;
  }

  function showMessage(text, sub, duration=1600){
    messageEl.innerHTML = text + (sub? '<div class="sub">'+sub+'</div>' : '');
    messageEl.style.opacity = '1';
    clearTimeout(messageEl._t);
    messageEl._t = setTimeout(()=>{ messageEl.style.opacity = '0'; }, duration);
  }
  messageEl.style.transition = 'opacity .3s';

  function showPhaseTip(text){
    phaseTip.textContent = text;
    phaseTip.classList.add('show');
    clearTimeout(phaseTip._t);
    phaseTip._t = setTimeout(()=>phaseTip.classList.remove('show'), 1800);
  }

  function setHearts(){
    hearts.forEach((h,i)=>{
      if (i < state.lives) { h.classList.remove('lost','burst'); h.textContent='❤️'; }
      else h.classList.add('lost');
    });
  }

  function updateHud(){
    scoreDisplay.textContent = '得分 ' + state.score + ' · 第 ' + state.round + ' 关';
    expressionEl.textContent = '得分 ' + state.score;
  }

  // ===== 特效 =====
  function burst(x,y,color){
    for (let i=0;i<14;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const ang = Math.random()*Math.PI*2, dist = 30+Math.random()*60;
      s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
      s.style.background = color;
      s.style.left = x+'px'; s.style.top = y+'px';
      stage.appendChild(s);
      setTimeout(()=>s.remove(), 700);
    }
  }
  function floatText(text, x, y, color){
    const f = document.createElement('div');
    f.className = 'float-text';
    f.textContent = text;
    f.style.color = color;
    f.style.left = x+'px'; f.style.top = y+'px';
    stage.appendChild(f);
    setTimeout(()=>f.remove(), 1000);
  }

  // ===== 玩家移动（三个固定通道） =====
  const LANES = 3;
  let currentLane = 1; // 0/1/2
  let targetX = 0;

  function laneCenterX(lane){
    // 与数字块掉落通道中心对齐
    const gap = stageW() / 4;
    return gap * (lane + 1) - 33 + 33; // 数字块 left + 块宽一半 = 中心
  }
  function laneToPlayerX(lane){
    return laneCenterX(lane) - 46; // 玩家容器宽 92，中心对齐
  }
  function recalcTargetX(){
    targetX = laneToPlayerX(currentLane);
  }
  function moveToLane(lane){
    currentLane = Math.max(0, Math.min(LANES - 1, lane));
    recalcTargetX();
    player.classList.add('run');
  }
  function movePlayerDelta(d){
    moveToLane(currentLane + d);
  }
  function playerCenterX(){ return laneCenterX(currentLane); }
  function playerTopY(){ return stageH() - 14 - 118 - 30; } // 头顶脸盆的顶部位置

  // 动画循环更新位置
  function tickPlayer(){
    const cur = parseFloat(player.style.left || 0);
    const diff = targetX - cur;
    if (Math.abs(diff) > 1){
      player.style.left = (cur + diff*0.25) + 'px';
    } else {
      player.style.left = targetX + 'px';
      player.classList.remove('run');
    }
  }

  // ===== 数字块生成 =====
  function spawnNum(value, x, isAnswer, speedMul){
    const el = document.createElement('div');
    el.className = 'num';
    const len = String(value).replace('-','').length;
    if (len >= 4) el.classList.add('small');
    else if (len >= 3) el.classList.add('small');
    el.textContent = value;
    el.style.left = x + 'px';
    el.style.top = '-80px';
    el.dataset.value = value;
    el.dataset.answer = isAnswer ? '1' : '0';
    dropArea.appendChild(el);

    const base = speedMap[settings.speed] * speedMul;
    el._vy = base;

    state.nums.push(el);
    return el;
  }

  function spawnWave(){
    clearPending(); // 清掉残留的定时器，避免重复生成
    state.nums.forEach(n=>n.remove());
    state.nums = [];
    basinNum.classList.add('empty');
    basinNum.textContent = '';

    if (state.mode === 'collect'){
      // 掉落可接的数字：每次掉 1 个，接住后进入下一波
      showPhaseTip('接住数字吧！还能接 ' + (settings.picks - state.collectedCount) + ' 个');
      const count = 3;
      const positions = [];
      const gap = stageW()/ (count+1);
      for (let i=0;i<count;i++){
        positions.push(gap*(i+1) - 33);
      }
      positions.forEach(px=>{
        const v = rand(0, settings.range);
        spawnNum(v, px, false, 1);
      });
    } else {
      // 掉落答案：一个正确，两个错误
      showPhaseTip('找出正确答案，接住它！');
      const correctX = rand(1,3);
      const gap = stageW()/4;
      const t = state.target;
      const lo = Math.min(0, Math.floor(t) - 15);
      const hi = Math.ceil(t) + 15;
      for (let i=0;i<3;i++){
        let v;
        if (i+1 === correctX) v = t;
        else {
          // 错误答案：与正确答案不同，取合理范围内的整数（或小数）
          do {
            v = rand(lo, hi);
            if (Number.isInteger(t)) v = Math.round(v);
          } while (v === t);
        }
        const px = gap*(i+1) - 33;
        spawnNum(v, px, i+1===correctX, 1);
      }
    }
  }

  // ===== 碰撞检测 =====
  function checkCollision(){
    const px = playerCenterX();
    const py = playerTopY(); // 头顶
    for (let i=state.nums.length-1;i>=0;i--){
      const n = state.nums[i];
      const nx = parseFloat(n.style.left);
      const ny = parseFloat(n.style.top);
      const nw = n.offsetWidth, nh = n.offsetHeight;
      // 盆子的水平范围 + 头顶垂直范围
      if (px > nx - nw/2 - 10 && px < nx + nw/2 + 10 &&
          ny + nh > py - 6 && ny < py + 30){
        return n;
      }
    }
    return null;
  }

  function handleCatch(n){
    const v = parseFloat(n.dataset.value);
    n.remove();
    state.nums = state.nums.filter(x=>x!==n);

    if (state.mode === 'collect'){
      // 接到一个数字
      state.picked.push(v);
      state.collectedCount++;
      basinNum.textContent = v;
      basinNum.classList.remove('empty');
      player.classList.add('happy');
      setTimeout(()=>player.classList.remove('happy'), 500);
      burst(playerCenterX(), playerTopY()-20, '#E0A94E');
      floatText('+'+v, playerCenterX()-20, playerTopY()-40, '#5C4433');
      showMessage('接住啦！', '数字 ' + v);
      sfxCatch();

      // 立即清空屏幕上其余数字，避免与新一波重叠
      state.nums.forEach(x=>{ if (x !== n) x.remove(); });
      state.nums = [];

      if (state.collectedCount >= settings.picks){
        // 进入计算阶段
        schedule(startAnswerPhase, 900);
      } else {
        schedule(spawnWave, 700);
      }
    } else {
      // 接答案
      if (n.dataset.answer === '1'){
        // 正确
        state.score += 100;
        state.round++;
        updateHud();
        player.classList.add('happy');
        setTimeout(()=>player.classList.remove('happy'), 600);
        burst(playerCenterX(), playerTopY()-20, '#4FA36A');
        floatText('正确! +100', playerCenterX()-50, playerTopY()-50, '#4FA36A');
        showMessage('答对啦！🎉', '+100 分');
        sfxCorrect();
        schedule(startCollectPhase, 1000);
      } else {
        // 错误
        loseLife();
      }
    }
  }

  function loseLife(){
    state.lives--;
    const idx = 3 - state.lives - 1;
    if (idx >= 0){
      hearts[idx].classList.add('burst');
      setTimeout(()=>hearts[idx].classList.add('lost'), 600);
    }
    player.classList.add('sad');
    setTimeout(()=>player.classList.remove('sad'), 600);
    burst(playerCenterX(), playerTopY()-20, '#E8543F');
    floatText('接错了！', playerCenterX()-50, playerTopY()-50, '#E8543F');
    showMessage('接错啦！💔', '剩余生命 ' + state.lives);
    sfxWrong();

    if (state.lives <= 0){
      sfxGameOver();
      endGame(false);
    } else {
      // 重新掉落这组答案
      schedule(spawnWave, 1000);
    }
  }

  // ===== 阶段切换 =====
  function startCollectPhase(){
    state.mode = 'collect';
    state.picked = [];
    state.collectedCount = 0;
    expressionEl.textContent = '得分 ' + state.score;
    expressionEl.classList.remove('flash');
    spawnWave();
  }

  function startAnswerPhase(){
    // 用接到的数字生成算式（从选中的运算符中随机组合）
    const a = state.picked[0];
    const b = state.picked[1] || 0;
    const c = state.picked[2] ?? null;

    const pickOp = () => settings.ops[rand(0, settings.ops.length - 1)];

    let expr, target;
    if (c === null){
      // 只有两个数
      const op = pickOp();
      const [sym, fn] = opMap[op];
      target = fn(a,b);
      expr = a + ' ' + sym + ' ' + b;
    } else {
      // 三个数：两步运算，运算符各自随机
      const op1 = pickOp();
      const op2 = pickOp();
      const [sym1, fn1] = opMap[op1];
      const [sym2, fn2] = opMap[op2];
      const mid = fn1(a,b);
      target = fn2(mid,c);
      expr = a + ' ' + sym1 + ' ' + b + ' ' + sym2 + ' ' + c;
    }

    target = Math.round(target * 100) / 100;

    state.target = target;
    state.mode = 'answer';
    expressionEl.textContent = expr + ' = ?';
    expressionEl.classList.remove('flash');
    void expressionEl.offsetWidth;
    expressionEl.classList.add('flash');
    showMessage('算一算：', expr + ' = ?', 1600);

    schedule(spawnWave, 1200);
  }

  // ===== 主循环 =====
  function gameLoop(){
    if (!state.running) return;
    if (state.paused) { state.raf = requestAnimationFrame(gameLoop); return; }
    // 移动数字块
    const h = stageH();
    for (let i=state.nums.length-1;i>=0;i--){
      const n = state.nums[i];
      let y = parseFloat(n.style.top) + n._vy;
      n.style.top = y + 'px';
      // 轻微水平晃动
      if (n.dataset.answer === '1' && state.mode==='answer'){
        // 正确答案可略微发光提示（不直接标记）
      }
      if (y > h){
        // 漏掉数字
        if (state.mode === 'collect'){
          // 漏接一个普通数字：不算失败，重新掉落这波
          n.remove();
          state.nums.splice(i,1);
          if (state.nums.length === 0) spawnWave();
        } else {
          // 漏接答案：视为错过，扣血？—— 温和处理：重新掉落
          n.remove();
          state.nums.splice(i,1);
          if (state.nums.length === 0) spawnWave();
        }
      }
    }
    tickPlayer();
    const caught = checkCollision();
    if (caught) handleCatch(caught);
    state.raf = requestAnimationFrame(gameLoop);
  }

  // ===== 开始/结束 =====
  function startGame(){
    clearPending();
    ensureAudio();
    menuOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    pauseBtn.classList.remove('hidden');
    state.lives = 3;
    state.score = 0;
    state.round = 1;
    state.running = true;
    state.paused = false;
    setHearts();
    updateHud();
    currentLane = 1;
    recalcTargetX();
    player.style.left = targetX + 'px';
    startCollectPhase();
    if (state.raf) cancelAnimationFrame(state.raf);
    state.raf = requestAnimationFrame(gameLoop);
    showMessage('开始！', '接住第一个数字');
    sfxCorrect();
  }

  function pauseGame(){
    if (!state.running || state.paused) return;
    state.paused = true;
    clearPending();
    pauseBtn.textContent = '▶';
    pauseOverlay.classList.remove('hidden');
    sfxPause();
  }

  function resumeGame(){
    if (!state.running || !state.paused) return;
    state.paused = false;
    pauseBtn.textContent = '⏸';
    pauseOverlay.classList.add('hidden');
    sfxCatch();
    // 若屏幕上没有数字块（正处于波次间隔），重新生成当前波
    if (state.nums.length === 0){
      spawnWave();
    }
  }

  function exitToMenu(){
    state.running = false;
    state.paused = false;
    cancelAnimationFrame(state.raf);
    clearPending();
    state.nums.forEach(n=>n.remove());
    state.nums = [];
    pauseBtn.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
    // 重置显示
    expressionEl.textContent = '准备…';
    basinNum.classList.add('empty');
    basinNum.textContent = '';
    setHearts();
    scoreDisplay.textContent = '得分 0 · 第 1 关';
  }

  function endGame(win){
    state.running = false;
    state.paused = false;
    cancelAnimationFrame(state.raf);
    clearPending();
    state.nums.forEach(n=>n.remove());
    state.nums = [];
    pauseBtn.classList.add('hidden');
    document.getElementById('over-title').textContent = win ? '闯关成功！' : '游戏结束';
    document.getElementById('final-score').textContent = state.score;
    document.getElementById('final-round').textContent = '通过 ' + (state.round-1) + ' 关 · 剩余生命 ' + state.lives;
    overOverlay.classList.remove('hidden');
  }

  // ===== 事件绑定 =====
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('over-exit-btn').addEventListener('click', exitToMenu);

  // 暂停相关
  pauseBtn.addEventListener('click', ()=>{
    if (state.paused) resumeGame();
    else pauseGame();
  });
  document.getElementById('resume-btn').addEventListener('click', resumeGame);
  document.getElementById('pause-restart-btn').addEventListener('click', ()=>{
    pauseOverlay.classList.add('hidden');
    startGame();
  });
  document.getElementById('pause-exit-btn').addEventListener('click', exitToMenu);

  // 键盘控制
  document.addEventListener('keydown', (e)=>{
    if (menuOverlay.classList.contains('hidden') && overOverlay.classList.contains('hidden')){
      if (e.key === 'Escape'){
        if (state.paused) resumeGame();
        else pauseGame();
        return;
      }
      if (e.key === ' '){
        e.preventDefault();
        if (state.paused) resumeGame();
        else pauseGame();
        return;
      }
      if (!state.paused){
        if (e.key === 'ArrowLeft') movePlayerDelta(-1);
        else if (e.key === 'ArrowRight') movePlayerDelta(1);
      }
    }
  });

  // 触屏/鼠标控制：点击/拖动吸附到最近的通道
  let dragging = false;
  function pointerToLane(clientX){
    const cx = clientX - stage.getBoundingClientRect().left;
    let best = 0, bestDist = Infinity;
    for (let l=0; l<LANES; l++){
      const d = Math.abs(laneCenterX(l) - cx);
      if (d < bestDist){ bestDist = d; best = l; }
    }
    return best;
  }
  stage.addEventListener('pointerdown', (e)=>{
    if (!menuOverlay.classList.contains('hidden')) return;
    if (state.paused) return;
    dragging = true;
    moveToLane(pointerToLane(e.clientX));
  });
  stage.addEventListener('pointermove', (e)=>{
    if (dragging){
      moveToLane(pointerToLane(e.clientX));
    }
  });
  window.addEventListener('pointerup', ()=>{ dragging = false; });

  // 初始定位
  currentLane = 1;
  recalcTargetX();
  player.style.left = targetX + 'px';
  updateHud();

  // 窗口大小变化
  window.addEventListener('resize', ()=>{
    recalcTargetX();
    player.style.left = targetX + 'px';
  });
})();
</script>
</body>
